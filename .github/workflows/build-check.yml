# Temporary: verifies the OpenMP build on Linux and macOS before CI is switched on.
# Replaced by ci.yml (Task 1). Runs only on pushes to build-check/** branches.
name: build-check

on:
  push:
    branches:
      - "build-check/**"

jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
        python-version: ["3.10", "3.13"]
    env:
      CHARIS_REQUIRE_OPENMP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install charis
        run: python -m pip install -v ".[test]"

      - name: Report OpenMP status
        working-directory: ${{ runner.temp }}
        run: python -c "import charis; print('openmp_enabled:', charis.openmp_enabled())"

      # Run against the installed package from outside the checkout: from the repo root,
      # pytest would put the source tree (which has no compiled extensions) first on sys.path.
      - name: Test
        working-directory: ${{ runner.temp }}
        run: python -m pytest --pyargs charis -q
