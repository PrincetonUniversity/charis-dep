name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  # Dependencies float within their ranges, so a new upstream release can break
  # the package while the repo is quiet. GitHub runs scheduled workflows on the
  # default branch only.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff check
        run: ruff check src/charis/

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      # The compiled extensions and the OpenMP setup differ per platform, so every
      # platform builds at both ends of the supported range; the middle versions run
      # on Linux x86_64 only.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
        python-version: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    env:
      CHARIS_REQUIRE_OPENMP: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm derives the version from the tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      # A non-editable install, so the tests below check what a user gets: the package
      # must find its registry and console scripts without the source tree.
      - name: Install charis
        run: python -m pip install -v ".[test]"

      - name: Report version and OpenMP status
        working-directory: ${{ runner.temp }}
        run: python -c "import charis; print(charis.__version__, charis.__file__, 'openmp:', charis.openmp_enabled())"

      # The tests read the checkout's calibration tree, so CI never contacts Zenodo.
      - name: Link calibration data
        shell: bash
        run: |
          python .github/scripts/link_calibrations.py calibrations "$RUNNER_TEMP/calib"
          echo "CHARIS_CALIBRATION_DIR=$RUNNER_TEMP/calib" >> "$GITHUB_ENV"

      # Run from outside the checkout: from the repo root, pytest would put the source
      # tree (which has no compiled extensions) first on sys.path.
      - name: Test
        working-directory: ${{ runner.temp }}
        run: python -m pytest --pyargs charis -q

      - name: Console script runs
        working-directory: ${{ runner.temp }}
        shell: bash
        run: extractcube | grep -q "Must call extractcube.py"

  # Downloads the pinned Zenodo records into an empty cache, so a broken download path
  # (moved record, changed API, wrong md5) shows up. Not a dependency of the test jobs.
  fetch-calibrations:
    name: Fetch calibration data from Zenodo
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install charis
        run: python -m pip install .

      - name: Fetch all instruments
        working-directory: ${{ runner.temp }}
        env:
          CHARIS_CALIBRATION_DIR: ${{ runner.temp }}/calib-fetch
        run: charis-calibrations fetch all
