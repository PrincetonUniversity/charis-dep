[workspace]
name = "charis"
description = "Data Reduction Pipeline for the CHARIS and SPHERE Integral-Field Spectrographs"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

# ──────────────────────────────────────────────
# Core dependencies (mirrors [project.dependencies] in pyproject.toml)
# ──────────────────────────────────────────────
[dependencies]
python = ">=3.11,<3.14"
numpy = ">=2,<3"
scipy = "*"
astropy = "*"
pandas = "*"
tqdm = "*"
future = "*"
matplotlib = "*"
bokeh = "*"
bottleneck = "*"
psutil = "*"
# Build dependencies for Cython extensions
cython = ">=3.1,<4"
setuptools = ">=77"
setuptools-scm = ">=8.0"
jupyterlab = ">=4.5.6,<5"

# Editable install of the package itself
[pypi-dependencies]
charis = { path = ".", editable = true }

# ──────────────────────────────────────────────
# Feature: notebook
# ──────────────────────────────────────────────
[feature.notebook.dependencies]
ipython = "*"
notebook = "*"
jupyterlab = "*"
ipywidgets = "*"
ipympl = "*"

# ──────────────────────────────────────────────
# Feature: test
# ──────────────────────────────────────────────
[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
ruff = "*"

# ──────────────────────────────────────────────
# Environments
# ──────────────────────────────────────────────
[environments]
default = { solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
dev = { features = ["notebook", "test"], solve-group = "default" }

# ──────────────────────────────────────────────
# Tasks
# ──────────────────────────────────────────────
[feature.test.tasks]
test = "pytest"
lint = "ruff check src/charis/"
format = "ruff format src/charis/"
format-check = "ruff format --check src/charis/"
